name: Build Android App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run mobile:build
        env:
          EXPORT: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          NEXT_PUBLIC_HOSTED_URL: ${{ secrets.NEXT_PUBLIC_HOSTED_URL || 'https://placeholder.vercel.app' }}
          NEXT_PUBLIC_UPDATE_MANIFEST_URL: ${{ secrets.NEXT_PUBLIC_UPDATE_MANIFEST_URL || 'https://calendar-app22.vercel.app/api/update' }}
          # Temporary: enables on-screen debug overlay to prove updater execution on device
          NEXT_PUBLIC_DEBUG_UPDATER: 'true'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android

      - name: Inject AutoUpdatePlugin into Android Project
        run: |
          set -e
          PLUGIN_DIR="android/app/src/main/java/com/calendarapp/secure/plugins"
          mkdir -p "$PLUGIN_DIR"

          cat > "$PLUGIN_DIR/AutoUpdatePlugin.java" << 'JAVA_EOF'
          package com.calendarapp.secure.plugins;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import android.util.Log;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.BufferedInputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;

          @CapacitorPlugin(name = "AutoUpdate")
          public class AutoUpdatePlugin extends Plugin {
              private static final String TAG = "AutoUpdatePlugin";

              @PluginMethod
              public void getAppInfo(PluginCall call) {
                  try {
                      Context context = getContext();
                      String packageName = context.getPackageName();
                      String versionName = context.getPackageManager().getPackageInfo(packageName, 0).versionName;
                      long versionCode;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          versionCode = context.getPackageManager().getPackageInfo(packageName, 0).getLongVersionCode();
                      } else {
                          versionCode = context.getPackageManager().getPackageInfo(packageName, 0).versionCode;
                      }
                      JSObject ret = new JSObject();
                      ret.put("versionName", versionName);
                      ret.put("versionCode", versionCode);
                      ret.put("packageName", packageName);
                      call.resolve(ret);
                  } catch (Exception e) {
                      Log.e(TAG, "Failed to get app info", e);
                      call.reject("Failed to get package info: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void checkInstallPermission(PluginCall call) {
                  JSObject ret = new JSObject();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      boolean canInstall = getContext().getPackageManager().canRequestPackageInstalls();
                      ret.put("allowed", canInstall);
                  } else {
                      ret.put("allowed", true);
                  }
                  call.resolve(ret);
              }

              @PluginMethod
              public void requestInstallPermission(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          Intent intent = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES);
                          intent.setData(Uri.parse("package:" + getContext().getPackageName()));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(intent);
                          call.resolve();
                      } catch (Exception e) {
                          Intent intent = new Intent(Settings.ACTION_SECURITY_SETTINGS);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(intent);
                          call.resolve();
                      }
                  } else {
                      call.resolve();
                  }
              }

              @PluginMethod
              public void downloadAndInstall(PluginCall call) {
                  String urlString = call.getString("url");
                  String sha256 = call.getString("sha256");
                  if (urlString == null || urlString.isEmpty()) { call.reject("URL is required"); return; }
                  if (!urlString.startsWith("https://")) { call.reject("Only HTTPS URLs are allowed"); return; }
                  new Thread(() -> {
                      File apkFile = null;
                      try {
                          Context context = getContext();
                          apkFile = new File(context.getCacheDir(), "update.apk");
                          if (apkFile.exists()) apkFile.delete();
                          URL url = new URL(urlString);
                          HttpURLConnection connection = (HttpURLConnection) url.openConnection();
                          connection.setConnectTimeout(15000); connection.setReadTimeout(15000);
                          connection.connect();
                          if (connection.getResponseCode() != HttpURLConnection.HTTP_OK) {
                              throw new Exception("Server HTTP " + connection.getResponseCode());
                          }
                          int fileLength = connection.getContentLength();
                          InputStream input = new BufferedInputStream(connection.getInputStream(), 8192);
                          FileOutputStream output = new FileOutputStream(apkFile);
                          MessageDigest digest = MessageDigest.getInstance("SHA-256");
                          byte[] data = new byte[8192]; long total = 0; int count; long lastProgressTime = 0;
                          while ((count = input.read(data)) != -1) {
                              total += count; output.write(data, 0, count); digest.update(data, 0, count);
                              long now = System.currentTimeMillis();
                              if (fileLength > 0 && now - lastProgressTime > 150) {
                                  lastProgressTime = now;
                                  JSObject p = new JSObject(); p.put("progress", (int)(total*100/fileLength)); p.put("status", "downloading");
                                  notifyListeners("downloadProgress", p);
                              }
                          }
                          output.flush(); output.close(); input.close();
                          JSObject p100 = new JSObject(); p100.put("progress", 100); p100.put("status", "downloading"); notifyListeners("downloadProgress", p100);
                          byte[] hashBytes = digest.digest();
                          StringBuilder sb = new StringBuilder();
                          for (byte b : hashBytes) sb.append(String.format("%02x", b));
                          String calculatedHash = sb.toString();
                          if (sha256 != null && !sha256.isEmpty() && !calculatedHash.equalsIgnoreCase(sha256)) {
                              apkFile.delete(); throw new Exception("SHA-256 mismatch");
                          }
                          installApkFile(context, apkFile, call);
                      } catch (Exception e) {
                          Log.e(TAG, "Download error", e);
                          if (apkFile != null && apkFile.exists()) apkFile.delete();
                          JSObject err = new JSObject(); err.put("error", e.getMessage()); err.put("status", "failed");
                          notifyListeners("downloadProgress", err); call.reject(e.getMessage());
                      }
                  }).start();
                  JSObject ret = new JSObject(); ret.put("status", "started"); call.resolve(ret);
              }

              private void installApkFile(Context context, File apkFile, PluginCall call) throws Exception {
                  if (!apkFile.exists()) throw new Exception("APK file does not exist");
                  Uri apkUri;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      apkUri = FileProvider.getUriForFile(context, context.getPackageName() + ".fileprovider", apkFile);
                  } else { apkUri = Uri.fromFile(apkFile); }
                  Intent intent = new Intent(Intent.ACTION_VIEW);
                  intent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  context.startActivity(intent);
                  JSObject inst = new JSObject(); inst.put("status", "installing"); notifyListeners("downloadProgress", inst);
              }
          }
          JAVA_EOF

          # Patch MainActivity to register the AutoUpdatePlugin
          MAIN_ACTIVITY="android/app/src/main/java/com/calendarapp/secure/MainActivity.java"
          if grep -q "AutoUpdatePlugin" "$MAIN_ACTIVITY"; then
            echo "AutoUpdatePlugin already registered in MainActivity"
          else
            # Add import
            sed -i 's/import android.content.Intent;/import android.content.Intent;\nimport com.calendarapp.secure.plugins.AutoUpdatePlugin;/' "$MAIN_ACTIVITY"
            # Add registerPlugin call inside onCreate before super.onCreate
            sed -i 's/sanitizeIntent(getIntent());/sanitizeIntent(getIntent());\n        this.registerPlugin(AutoUpdatePlugin.class);/' "$MAIN_ACTIVITY"
            echo "AutoUpdatePlugin registered in MainActivity successfully"
          fi

          echo "=== AutoUpdatePlugin injection complete ==="
          cat "$MAIN_ACTIVITY"

      - name: Configure Firebase FCM Plugins & Credentials
        run: |
          node scripts/configure-fcm.js
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Generate App Launcher Icons
        run: |
          npx @capacitor/assets generate --android

      - name: Sync Web Code to Native App
        run: npx cap sync android

      - name: Build Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Set Build Tools Version
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<< "$VERSION"
          patch=$(echo "$patch" | cut -d'-' -f1)
          VERSION_CODE=$((major * 10000 + minor * 100 + patch))
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Sign Release APK
        id: sign_app
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed Release APK Artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Calendar
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Calculate Checksum
        id: checksum
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          SIGNED_APK_PATH="${{ steps.sign_app.outputs.signedReleaseFile }}"
          SHA256_HASH=$(sha256sum "$SIGNED_APK_PATH" | awk '{print $1}')
          echo "sha256=$SHA256_HASH" >> $GITHUB_OUTPUT
          echo "SHA-256 Checksum: $SHA256_HASH"

      - name: Generate Release Manifest
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          APK_FILENAME=$(basename "${{ steps.sign_app.outputs.signedReleaseFile }}")
          TAG_NAME="${{ github.ref_name }}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9] ]]; then
            TAG_NAME="v${{ steps.get_version.outputs.version_name }}"
          fi
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${APK_FILENAME}"
          
          cat <<EOF > latest.json
          {
            "versionName": "${{ steps.get_version.outputs.version_name }}",
            "versionCode": ${{ steps.get_version.outputs.version_code }},
            "apkUrl": "${APK_URL}",
            "mandatory": false,
            "releaseNotes": [
              "Security and performance improvements",
              "Bug fixes and updates"
            ],
            "minimumSupportedVersionCode": ${{ steps.get_version.outputs.version_code }},
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "sha256": "${{ steps.checksum.outputs.sha256 }}"
          }
          EOF
          cat latest.json

      - name: Create GitHub Release & Upload Assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.get_version.outputs.version_name) }}
          name: Calendar ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.get_version.outputs.version_name) }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.sign_app.outputs.signedReleaseFile }}
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
