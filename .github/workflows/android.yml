name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run mobile:build
        env:
          EXPORT: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          NEXT_PUBLIC_HOSTED_URL: ${{ secrets.NEXT_PUBLIC_HOSTED_URL || 'https://placeholder.vercel.app' }}

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android

      - name: Configure Firebase FCM Plugins & Credentials
        run: |
          node scripts/configure-fcm.js
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Generate App Launcher Icons
        run: |
          npx @capacitor/assets generate --android

      - name: Sync Web Code to Native App
        run: npx cap sync android

      - name: Build Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Set Build Tools Version
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<< "$VERSION"
          patch=$(echo "$patch" | cut -d'-' -f1)
          VERSION_CODE=$((major * 10000 + minor * 100 + patch))
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Sign Release APK
        id: sign_app
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed Release APK Artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Calendar
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Calculate Checksum
        id: checksum
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          SIGNED_APK_PATH="${{ steps.sign_app.outputs.signedReleaseFile }}"
          SHA256_HASH=$(sha256sum "$SIGNED_APK_PATH" | awk '{print $1}')
          echo "sha256=$SHA256_HASH" >> $GITHUB_OUTPUT
          echo "SHA-256 Checksum: $SHA256_HASH"

      - name: Generate Release Manifest
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          APK_FILENAME=$(basename "${{ steps.sign_app.outputs.signedReleaseFile }}")
          TAG_NAME="${{ github.ref_name }}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9] ]]; then
            TAG_NAME="v${{ steps.get_version.outputs.version_name }}"
          fi
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${APK_FILENAME}"
          
          cat <<EOF > latest.json
          {
            "versionName": "${{ steps.get_version.outputs.version_name }}",
            "versionCode": ${{ steps.get_version.outputs.version_code }},
            "apkUrl": "${APK_URL}",
            "mandatory": false,
            "releaseNotes": [
              "Security and performance improvements",
              "Bug fixes and updates"
            ],
            "minimumSupportedVersionCode": ${{ steps.get_version.outputs.version_code }},
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "sha256": "${{ steps.checksum.outputs.sha256 }}"
          }
          EOF
          cat latest.json

      - name: Create GitHub Release & Upload Assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.get_version.outputs.version_name) }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.get_version.outputs.version_name) }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.sign_app.outputs.signedReleaseFile }}
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
